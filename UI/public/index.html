<!DOCTYPE html>
<html lang="">

<head>
	<meta charset="utf-8">
	<meta content="IE=edge" http-equiv="X-UA-Compatible">
	<meta content="width=device-width,initial-scale=1" name="viewport">
	<meta content="noindex" name="robots">
	<link href="<%= BASE_URL %>img/icon/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180">
	<link href="<%= BASE_URL %>site.webmanifest" rel="manifest">
	<meta content="#da532c" name="msapplication-TileColor">
	<meta content="#ffffff" name="theme-color">
	<link href="<%= BASE_URL %>favicon.ico" rel="shortcut icon" type="image/x-icon">
	<link href="<%= BASE_URL %>favicon.ico" mask="" rel="icon" sizes="any">
	<link href="<%= BASE_URL %>css/custom.css" rel="stylesheet">
	<title>
		CamaOS
	</title>
</head>

<body>
	<noscript>
		<strong>We're sorry but CamaOS doesn't work properly without JavaScript enabled.
			Please enable it to continue.</strong>
	</noscript>
	<div id="app"></div>
	<script type="text/javascript">
		// Diagnostic overlay for the mobile-only "white screen" reports: on
		// some phones the app never mounts and nothing is visible or
		// reportable, with no way to plug in a desktop devtools session to
		// see why. This runs before the Vue bundle and needs no build step
		// or dependency, so it still fires even if the bundle itself fails
		// to load or throws during evaluation - it shows the actual error
		// on screen (instead of a blank page) and a "still loading" notice
		// if the app hasn't mounted after a few seconds, so a failure can
		// actually be read/reported instead of just being a blank page.
		(function () {
			var shown = false;
			// Set to true once Vue successfully mounts (see main.js). Before
			// that, any error really could mean the app never came up at all,
			// so it's worth blanking the page to show it. After a successful
			// mount, the app is otherwise working - a single failed background
			// request (a widget refresh, a stray network blip) shouldn't blank
			// a page that's actually fine, so it's just logged instead, the
			// same as an uncaught error would be in any normal app.
			window.__casaosMounted = false;
			function showOverlay(title, detail) {
				if (window.__casaosMounted) {
					console.error('[CamaOS]', title, detail);
					return;
				}
				if (shown || document.getElementById('boot-error-overlay')) return;
				shown = true;
				var el = document.createElement('div');
				el.id = 'boot-error-overlay';
				el.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#1a1a1a;color:#fff;' +
					'font:14px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;padding:20px;overflow:auto;' +
					'white-space:pre-wrap;word-break:break-word;';
				var strong = document.createElement('strong');
				strong.textContent = title;
				strong.style.cssText = 'display:block;margin-bottom:10px;color:#ff6b6b;font-size:16px;';
				var pre = document.createElement('div');
				pre.textContent = detail || '';
				el.appendChild(strong);
				el.appendChild(pre);
				document.body.appendChild(el);
			}

			// exposed so main.js can route Vue's own errorHandler through the
			// same on-screen overlay, since Vue swallows component errors
			// rather than letting them reach window.onerror
			window.__casaosShowBootError = showOverlay;

			// A required chunk 404ing almost always means this page's own
			// index.html is stale - it's asking for a content-hashed filename
			// from a previous build that no longer exists on the server (the
			// hash changes whenever that chunk's contents/dependencies do).
			// There's no way to fix the server's caching of index.html from
			// here, so instead: try one hard, cache-busting reload of the page
			// itself before giving up. A sessionStorage flag stops this from
			// looping if the failure turns out to be a real outage.
			function reloadBustingCache() {
				var flag = 'casaos_reload_attempted';
				try {
					if (sessionStorage.getItem(flag)) return false;
					sessionStorage.setItem(flag, '1');
				} catch (e) {
					// storage unavailable (e.g. private mode) - fall through and
					// still attempt exactly one reload, just without the guard
				}
				location.href = location.protocol + '//' + location.host + location.pathname +
					'?_cb=' + Date.now() + location.hash;
				return true;
			}

			window.addEventListener('error', function (event) {
				var target = event.target;
				if (target && target !== window) {
					// element-level resource failure (capture phase catches
					// these) - only the JS bundle and its stylesheet are
					// actually fatal to the app. Everything else (app icons,
					// wallpaper, fonts, etc) fails harmlessly all the time
					// and must not blank the whole page over it.
					if (target.tagName === 'SCRIPT' || (target.tagName === 'LINK' && target.rel === 'stylesheet')) {
						if (reloadBustingCache()) return;
						showOverlay('CamaOS failed to load a required file', 'Could not load: ' + (target.src || target.href) +
							'\n\nA cache-busting reload was already tried and it still failed - this looks like a real issue, not stale cache.');
					}
					return;
				}
				// no target (or target is window) means this is a genuine
				// uncaught runtime error, not a resource load failure
				showOverlay('CamaOS hit an error while starting', (event.error && event.error.stack) || event.message || String(event));
			}, true);

			window.addEventListener('unhandledrejection', function (event) {
				var reason = event.reason;
				showOverlay('CamaOS hit an error while starting', (reason && reason.stack) || (reason && reason.message) || String(reason));
			});

			setTimeout(function () {
				var appEl = document.getElementById('app');
				if (!shown && appEl && appEl.childElementCount === 0) {
					showOverlay('CamaOS is taking longer than expected to load', 'No script error was caught, so this is likely a network or caching issue - try a hard refresh, or reloading with cache disabled.');
				}
			}, 8000);
		})();
	</script>
	<!-- built files will be auto injected -->
	<script type="text/javascript" src="<%= BASE_URL %>js/custom.js"></script>
</body>

</html>
