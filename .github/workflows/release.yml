name: Build and release fork

# The original release.yml called IceWhaleTech's private reusable workflow
# (needs their OAuth secrets and only publishes to IceWhaleTech/CasaOS).
# This is a self-contained replacement: push a tag like v1.0.0 and it builds
# the backend for linux/amd64 + linux/arm64, builds the UI once, packages
# each architecture as a tarball, and attaches them to a GitHub Release on
# this repo. update.sh (repo root) is what a server pulls these down with.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: UI/pnpm-lock.yaml
      - run: pnpm install
        working-directory: UI
      - run: pnpm run build
        working-directory: UI
      - uses: actions/upload-artifact@v4
        with:
          name: www
          path: UI/build/sysroot/var/lib/casaos/www

  build-backend:
    # Native per-arch runners, not cross-compilation: icon uploads encode to
    # WebP via github.com/chai2010/webp, which needs CGO + libwebp - far
    # simpler to build natively on a matching runner than to cross-compile
    # CGO with a cross C toolchain + cross libwebp for arm64.
    #
    # Bounded well under GitHub's 6h default - confirmed live that a flaky
    # apt mirror can otherwise hang a job indefinitely with no useful
    # signal that anything's wrong.
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # go.sum already pins the exact hash for every dependency - that's the
    # real integrity check, and it's verified locally regardless. GOSUMDB
    # additionally confirms each module against Google's public transparency
    # log, which has flaked before (confirmed live: sum.golang.org dropped
    # the connection mid-request and failed the whole build). Same "bypass
    # the flaky external mirror" call as the apt sources below, not a
    # meaningful security loss given go.sum is already the source of truth.
    #
    # GOTOOLCHAIN=local: this is a two-module repo where the root go.mod
    # asks for go 1.25.0 but AppManagement/go.mod only needs go 1.21 -
    # actions/setup-go's own internal sanity check (`go env GOPATH`) runs
    # from the repo root, sees the root's go 1.25.0 directive even for the
    # build-app-management job, and silently auto-downloads a whole second
    # toolchain to satisfy it. That download used to succeed quietly via
    # GOSUMDB; with GOSUMDB off, Go correctly refuses to skip verification
    # for a full toolchain swap and hard-fails instead. Since each job's own
    # setup-go step already installs the exact version it actually needs,
    # there's no legitimate reason for this auto-switch to fire in CI at
    # all - forcing "local" removes the extra network round-trip instead of
    # just working around its failure mode.
    env:
      GOSUMDB: "off"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install libwebp-dev
        # The runner's default sources include a region-local azure mirror
        # that's been unreliable (confirmed live: hung 24+ min on one run,
        # then hit the 15-min job timeout on a later run - it was retrying
        # separately per-component index file, dozens of them, so
        # per-request timeouts alone weren't enough). Bypass the runner's
        # preconfigured sources entirely and update against only the
        # canonical Ubuntu mirrors instead.
        #
        # archive.ubuntu.com/security.ubuntu.com only host amd64/i386 -
        # confirmed live this 404s on every index for arm64, which lives on
        # the entirely separate ports.ubuntu.com mirror instead (which also
        # folds security updates into the same host, unlike amd64's split).
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            cat <<'SOURCES' | sudo tee /etc/apt/sources.list.d/reliable-only.list
          deb http://ports.ubuntu.com/ubuntu-ports noble main universe restricted multiverse
          deb http://ports.ubuntu.com/ubuntu-ports noble-updates main universe restricted multiverse
          deb http://ports.ubuntu.com/ubuntu-ports noble-security main universe restricted multiverse
          SOURCES
          else
            cat <<'SOURCES' | sudo tee /etc/apt/sources.list.d/reliable-only.list
          deb http://archive.ubuntu.com/ubuntu noble main universe restricted multiverse
          deb http://archive.ubuntu.com/ubuntu noble-updates main universe restricted multiverse
          deb http://security.ubuntu.com/ubuntu noble-security main universe restricted multiverse
          SOURCES
          fi
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/reliable-only.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0" update
          sudo apt-get install -y --no-install-recommends libwebp-dev
      - run: go generate ./...
      - env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -ldflags "-s -w -X main.commit=${{ github.sha }} -X github.com/IceWhaleTech/CasaOS/common.ForkVersion=${{ github.ref_name }}" -o casa main.go
      - uses: actions/upload-artifact@v4
        with:
          name: casa-linux-${{ matrix.arch }}
          path: casa

  build-app-management:
    timeout-minutes: 15
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    # see the matching comments in build-backend above - same sum.golang.org
    # flakiness, and this is the job that actually hit the cross-module
    # toolchain auto-download GOTOOLCHAIN=local heads off.
    env:
      GOSUMDB: "off"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: AppManagement/go.mod
          # without this, setup-go's cache auto-detection falls back to
          # looking for go.sum at the repo root - the ROOT module's
          # go.sum, not AppManagement's - so this job's own dependencies
          # were never actually being cached correctly.
          cache-dependency-path: AppManagement/go.sum
      - run: go generate ./...
        working-directory: AppManagement
      - env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -ldflags "-s -w -X main.commit=${{ github.sha }} -X main.forkVersion=${{ github.ref_name }}" -o casaos-app-management main.go
        working-directory: AppManagement
      - uses: actions/upload-artifact@v4
        with:
          name: app-management-linux-${{ matrix.arch }}
          path: AppManagement/casaos-app-management

  package-and-release:
    needs: [build-ui, build-backend, build-app-management]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package tarballs
        run: |
          set -e
          for arch in amd64 arm64; do
            dir="package-$arch"
            mkdir -p "$dir/www"
            cp "artifacts/casa-linux-$arch/casa" "$dir/casa"
            chmod +x "$dir/casa"
            cp "artifacts/app-management-linux-$arch/casaos-app-management" "$dir/casaos-app-management"
            chmod +x "$dir/casaos-app-management"
            cp -r artifacts/www/. "$dir/www/"
            tar -czf "casaos-linux-$arch.tar.gz" -C "$dir" casa casaos-app-management www
          done
          sha256sum casaos-linux-*.tar.gz > checksums.txt
      - name: Generate changelog
        # generate_release_notes only works off merged PRs - this repo pushes
        # straight to main, so that produces nothing but a bare compare link.
        # Build real notes from the actual commit log since the previous tag
        # instead, so both the GitHub release and the in-dashboard "what
        # changed" view (GET /v1/sys/update-fork/check reads this same release
        # body via the GitHub API) always reflect what actually shipped.
        run: |
          set -e
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          {
            if [ -n "$PREV_TAG" ]; then
              echo "## Changes since $PREV_TAG"
              echo
              git log "$PREV_TAG..${{ github.ref_name }}" --pretty=format:"- %s"
            else
              echo "## Initial release"
            fi
          } > CHANGELOG_BODY.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            casaos-linux-amd64.tar.gz
            casaos-linux-arm64.tar.gz
            checksums.txt
          body_path: CHANGELOG_BODY.md
